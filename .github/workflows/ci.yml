name: CI

on:
  push:
  pull_request:

jobs:
  dsp:
    name: DSP library, tests and renders (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - os: windows-latest
            configure: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
